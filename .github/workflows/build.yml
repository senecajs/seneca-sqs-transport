name: build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    env:
      SENECA_TEST_SQS_ENDPOINT: http://127.0.0.1:19324

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # which a service container cannot mount (services start before
      # checkout), so it is started here, as in docker-compose.yml.
      - name: Start ElasticMQ
        run: |
          docker run -d --name seneca-sqs-transport-elasticmq \
            -p 19324:9324 \
            -v "$GITHUB_WORKSPACE/test/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro" \
            --health-cmd 'wget -q -O /dev/null "http://127.0.0.1:9324/?Action=ListQueues" || exit 1' \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            softwaremill/elasticmq-native:1.7.1
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' seneca-sqs-transport-elasticmq)" = healthy ] && exit 0
            sleep 2
          done
          docker logs seneca-sqs-transport-elasticmq
          exit 1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
